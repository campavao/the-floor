name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Ubuntu on purpose. Its filesystem is case-sensitive, like the one Vercel
    # builds on -- so a category pointing at "fruits/apple.png" when the file is
    # really "Fruits/Apples.png" fails here instead of in production. Running
    # these checks on Windows or macOS would hide the exact bug they catch.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
